# Strategie- en risicoconfiguratie. Wijzigingen hier vereisen geen code-aanpassing.

markets:            # Bitvavo marktnotatie — hierin handelt de bot (paper)
  - BTC-EUR
  - ETH-EUR

watchlist:          # alleen analyse/advies op het dashboard, bot handelt hier NIET
  - SOL-EUR
  - XRP-EUR
  - LINK-EUR

blocklist: []       # markten die de bot NOOIT verhandelt (geweerd uit scanner, auto-fill en handmatig toevoegen)

schedule:
  analysis_interval_minutes: 60      # swing: 1x per uur is voldoende
  candle_interval: "4h"              # candles voor analyse
  candle_limit: 200
  guard_interval_seconds: 60      # SL/TP-bewaking open posities (1 API-call per positie)

strategy:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  rsi_buy_zone_min: 25               # koopzone-ondergrens: daaronder is het vrije val, geen herstel
  rsi_buy_zone_max: 45               # koopzone-bovengrens (was impliciet rsi_oversold + 10 in code)
  rsi_overbought: 70                 # adviestabel op het dashboard: down-trend + RSI hierboven = "vermijden"
  atr_period: 14
  min_signal_score: 3                # aantal bevestigende condities voor kandidaat-BUY
  signal_on_closed_candles: true     # entries beoordelen op de laatst AFGESLOTEN candle; Bitvavo levert de lopende bar mee en flip-condities (MACD-hist) komen en gaan daarbinnen. Exits blijven op de live prijs. false = oud gedrag (meetbaar naast elkaar)

  max_chase_atr: 0.5                 # chase-guard: sla een entry over als de live prijs meer dan dit x ATR van de signaalclose af staat (bijwerking van signal_on_closed_candles: risico klopt nog, edge niet). 0 = uit
  chase_guard_binding: false         # false = shadow: treffer wordt gelogd (details.shadow_chase) maar blokkeert de koop niet. true pas bij positieve netto gate op >= 20 afgewikkelde trades

fees:
  maker_pct: 0.15                    # fallback; live worden fees via GET /account opgehaald
  taker_pct: 0.25
  slippage_buffer_pct: 0.10

decision:
  min_profit_pct: 0.50               # minimale winst boven fees+slippage (alleen nog rapportage; de optellende fee-gate blokkeerde in twee jaar backtest 0,0% van de kandidaten)
  max_breakeven_win_rate: 0.50       # DE fee-gate sinds v0.20.0: weiger een setup die meer dan deze trefkans nodig heeft om quitte te spelen. p* = (m*a + c) / (m*a * (1+r)) uit docs/ontwerp-ev-gate.md; bij ATR 1% van de prijs is dat 52%, bij ATR 3% 44%. 0 = uit
  atr_stop_multiplier: 2.0           # stop loss = entry - 2*ATR
  reward_risk_ratio: 1.5             # take profit = entry + 1.5*(2*ATR)
  use_llm_second_opinion: true
  llm_min_confidence: 0.6            # LLM moet >= 0.6 confident zijn, anders veto
  llm_veto_binding: false            # false = shadow-mode: veto wordt gelogd maar blokkeert de koop niet (meet gate-waarde zonder trades te kosten)

risk:
  paper_start_eur: 1000.0
  sizing: "bucket"                   # "bucket": vast bedrag per positie, aantal slots schaalt met kapitaal (1 extra per bucket). "percent": vast % van portfolio (legacy)
  bucket_eur: 250.0                  # bucket-modus: vast bedrag per positie EN kapitaal per extra slot (> EUR1250 = 5 slots, > EUR1500 = 6, enz.)
  max_position_pct: 25.0             # percent-modus: max % van portfolio per positie
  max_open_positions: 10             # hard plafond op het aantal open posities (in bucket-modus de bovengrens)
  cooldown_hours_after_trade: 12     # per markt; voorkomt fee-vretende flip-flops
  daily_loss_cap_pct: 3.0            # stop met kopen als dagverlies dit overschrijdt
  max_correlation: 0.85              # correlatiedrempel: hierboven telt een positie als "gecorreleerd"
  correlation_lookback: 60           # aantal candles voor de correlatieschatting
  max_correlated_positions: 2        # cluster-cap: max posities binnen één correlatie-cluster (2 = geen 3e sterk gecorreleerde)

universe:                            # kandidaten-universum: gepinde markets + auto-fill uit de scanner
  auto_fill: true                    # vrije slots aanvullen met scanner-hits die alle gates halen
  max_auto: 10                       # max aantal auto-fill kandidaten dat de bot per cyclus overweegt
  auto_fill_buffer: 2                # extra kandidaten boven de vrije slots (opvang voor uitval door gates)

exits:                               # mechanische exits bovenop SL/TP (geen AI). Trend-break-exit is in v0.19.0 geschrapt: vuurde nooit
  time_stop_candles: 12              # sluit een positie die na zoveel candles geen TP/SL raakte
  time_stop_min_net_pct: 0.0         # ... en per saldo op of onder deze netto % staat (incl. round-trip fees). 0 = break-even
  time_stop_binding: false           # TERUG NAAR SHADOW op 2026-08-06. Deze gate ging in v0.18.0 bindend zonder meting; de eerste meting (calibrate --vergelijk, portfolio-modus, 6 mnd echte data, 5 markten) gaf -15,7 procentpunt en een tekenwissel van +3,52% naar -12,17%, met 36% meer trades en dus meer fees. Meet nu mee via analysis/timestop.py; bindend maken pas bij een positieve netto gate over >= 20 afgewikkelde trades
  breakeven_stop:                    # winst die er was mag geen verlies worden
    enabled: true
    binding: false                   # false = shadow: treffer wordt gelogd, positie blijft open (meet gate-waarde). true pas bij positieve netto gate op >= 20 afgewikkelde trades
    trigger_atr: 1.0                 # bewapenen zodra de piek sinds entry >= 1x ATR boven de entry lag
    offset_margin_pct: 0.05          # vuren als de koers terugzakt tot <= entry + (werkelijke round-trip fee + deze marge). Paper = taker+taker = 0,50% -> drempel 0,55%; live = maker+taker = 0,40% -> drempel 0,45%. Zet `offset_pct` om de afleiding te overrulen met een vast getal

curation:                            # advies-only lijstbeheer (de bot verplaatst zelf niets)
  quiet_days: 30                     # gepinde coin met 0 koopsignalen in deze periode: dashboard-vlag "overweeg naar watchlist"

regime:                              # markt-brede regime-gate (gecodeerd, geen AI)
  enabled: true
  proxy_market: "BTC-EUR"            # BTC als markt-proxy: down-trend = risk-off
  binding: false                     # false = shadow: gelogd maar blokkeert de koop niet (meet gate-waarde). true pas na bewijs (fase 2 go)

meta:                                # reist mee met elk bewijsstuk (meetexport en elk shadow-event)
  run_purpose: "infrastructuurtest"    # WAAROM deze run draait. Sinds 2026-08-06 is de fase 2-vraag beantwoord met "geen edge" (tweejarige backtest, stijgend en dalend venster, blootstelling uitgerekend). De paper-run valideert dus geen strategie meer. Zonder dit label bouwt het meetapparaat maandenlang keurig gescopede cohortes op die over een half jaar als strategievalidatie gelezen worden. Zet terug op "strategievalidatie" zodra er een signaal draait waarvan dat wel geldt

export:                              # lichte meetexport naast de HA-image-back-up (ander herstelpad: honderden kB gzip i.p.v. een versleuteld image, terugzetten in seconden)
  enabled: true
  dir: ""                            # leeg = naast de database (in de add-on /data/exports)
  keep: 30                           # aantal exports dat bewaard blijft; 3 dagen image-retentie is te kort voor een meting van 4-8 weken
  share_dir: "/share/tradebot-export"  # tweede bestemming buiten /data: via Samba te pakken zonder de add-on aan te raken en overleeft herinstallatie. Leeg = alleen /data
  share_keep: 7                      # hoeveel exports daar blijven staan (kleiner, want /share is de grijpvoorraad en niet het archief)
  interval_hours: 24

llm:
  providers:                          # volgorde = voorkeursvolgorde
    - name: groq
      model: llama-3.1-8b-instant
      daily_budget: 200               # max calls per dag (ruim onder 14.400 free tier)
    - name: gemini
      model: gemini-2.5-flash
      daily_budget: 100
    - name: mistral
      model: mistral-small-latest
      daily_budget: 100
  timeout_seconds: 20
