# Home Assistant add-on manifest (local add-on)
name: AI Trade Platform
version: "0.22.0"
slug: tradebot
description: Fee-bewust AI swing-tradingplatform (Bitvavo, paper trading)
url: "https://github.com/MartinDoornbusch/martin-trade"
arch:
  - aarch64
  - amd64
# Voor de add-on-repository flow (optie B, automatische updates): regel hieronder
# aanzetten met je GitHub-gebruikersnaam. Supervisor pullt dan het CI-gebouwde image
# i.p.v. lokaal te bouwen.
image: ghcr.io/martindoornbusch/tradebot-addon-{arch}
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:finance
panel_title: Trade Platform
ports:
  8000/tcp: null        # standaard dicht; ingress volstaat. Zet op 8000 voor directe LAN-toegang.
ports_description:
  8000/tcp: Dashboard (optioneel, alleen nodig zonder ingress)
map:
  - addon_config:rw
  # /share voor de meetexport: /data is niet vanaf het netwerk te benaderen en
  # overleeft geen herinstallatie van de add-on, waardoor de export alleen te
  # verzilveren is via precies het image dat hij moest vermijden.
  - share:rw
# Regel voor deze lijst (zie ook config.py): opties zijn OPERATIONEEL, de
# strategie staat in config/config.yaml. Een knop hoort hier alleen thuis als
# omzetten een bedrijfsvoeringsbeslissing is die geen deploy mag vergen én de
# gemeten strategie niet verandert. Elke default hier moet gelijk zijn aan
# config/config.yaml, want entrypoint.py zet elke ingevulde optie als env-var en
# die overschrijft de yaml. Lege string = optie overslaan, dan wint de yaml.
options:
  trading_mode: paper
  markets: "BTC-EUR,ETH-EUR"
  watchlist: "SOL-EUR,XRP-EUR,LINK-EUR"
  blocklist: ""
  analysis_interval_minutes: 60
  candle_interval: 4h
  sizing: bucket
  bucket_eur: 250
  max_position_pct: 25
  max_open_positions: 10
  cooldown_hours: 12
  auto_fill: true
  regime_enabled: true
  regime_binding: false
  llm_veto_binding: false
  live_confirm: ""
  live_max_capital_eur: 100
  bitvavo_api_key: ""
  bitvavo_api_secret: ""
  groq_api_key: ""
  gemini_api_key: ""
  mistral_api_key: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  dashboard_token: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  trading_mode: list(paper|live)
  markets: str
  watchlist: str
  blocklist: str?
  analysis_interval_minutes: int(15,1440)
  candle_interval: list(1h|2h|4h|6h|8h|12h|1d)
  sizing: list(bucket|percent)
  bucket_eur: int(10,1000)
  max_position_pct: int(5,50)
  max_open_positions: int(1,10)
  cooldown_hours: int(1,72)
  auto_fill: bool
  regime_enabled: bool
  regime_binding: bool
  llm_veto_binding: bool
  live_confirm: str
  live_max_capital_eur: int(10,1000)
  bitvavo_api_key: str
  bitvavo_api_secret: password
  groq_api_key: password
  gemini_api_key: password
  mistral_api_key: password
  telegram_bot_token: password
  telegram_chat_id: str
  dashboard_token: str
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: password
